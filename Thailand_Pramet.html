<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHP2GeoJSON - Thailand Map Viewer</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 20px auto;
            width: 100%;
            gap: 20px;
            padding: 0 20px;
        }

        #map {
            flex: 1;
            min-height: 600px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }

        .sidebar {
            width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 15px;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 14px;
        }

        .stats {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .footer {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: auto;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
            }

            #map {
                min-height: 400px;
            }

            .header h1 {
                font-size: 20px;
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ SHP2GeoJSON - Thailand Map Viewer</h1>
        <p>Visualize converted shapefile data on Google Maps</p>
    </div>

    <div class="container">
        <div id="map"></div>
        <div class="sidebar">
            <h2>Information</h2>
            <div class="stats" id="stats">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading map data...
                </div>
            </div>
            <div class="info-group">
                <div class="info-label">Source File</div>
                <div class="info-value">Thailand.shp</div>
            </div>
            <div class="info-group">
                <div class="info-label">Output Format</div>
                <div class="info-value">GeoJSON (WGS84)</div>
            </div>
            <div class="info-group">
                <div class="info-label">File Size</div>
                <div class="info-value" id="fileSize">Loading...</div>
            </div>
            <div class="info-group">
                <div class="info-label">Features</div>
                <div class="info-value" id="featureCount">0</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Built with <strong>Node.js</strong> |
           <a href="https://github.com/prametkae-blip/SHP2GeOJson" target="_blank">View on GitHub</a>
        </p>
    </div>

    <script>
        let map;
        const GEOJSON_URL = './output/Thailand_Pramet.geojson';

        // Initialize map
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 5,
                center: { lat: 15.8700, lng: 100.9925 }, // Thailand center
                styles: [
                    {
                        featureType: 'all',
                        elementType: 'labels.text.fill',
                        stylers: [{ color: '#616161' }]
                    },
                    {
                        featureType: 'water',
                        elementType: 'geometry',
                        stylers: [{ color: '#e9e9e9' }, { lightness: 95 }]
                    }
                ]
            });

            loadGeoJSON();
        }

        // Load and display GeoJSON
        function loadGeoJSON() {
            fetch(GEOJSON_URL)
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load GeoJSON');
                    return response.json();
                })
                .then(geojsonData => {
                    displayGeoJSON(geojsonData);
                    updateStats(geojsonData);
                })
                .catch(error => {
                    console.error('Error loading GeoJSON:', error);
                    document.getElementById('stats').innerHTML =
                        '<div style="color: #d32f2f; padding: 20px; text-align: center;">' +
                        'Error loading map data. Make sure Thailand_Pramet.geojson exists and your Google Maps API key is valid.' +
                        '</div>';
                });
        }

        // Display GeoJSON on map
        function displayGeoJSON(geojsonData) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8'];
            let colorIndex = 0;

            geojsonData.features.forEach(feature => {
                const geometry = feature.geometry;
                const color = colors[colorIndex % colors.length];
                colorIndex++;

                switch (geometry.type) {
                    case 'Polygon':
                        drawPolygon(geometry.coordinates, color);
                        break;
                    case 'MultiPolygon':
                        geometry.coordinates.forEach(coords => {
                            drawPolygon(coords, color);
                        });
                        break;
                    case 'LineString':
                        drawPolyline(geometry.coordinates, color);
                        break;
                    case 'Point':
                        drawMarker(geometry.coordinates, color);
                        break;
                }
            });
        }

        // Draw polygon
        function drawPolygon(coords, color) {
            const paths = coords[0].map(coord => ({
                lat: coord[1],
                lng: coord[0]
            }));

            new google.maps.Polygon({
                paths: paths,
                strokeColor: color,
                strokeOpacity: 0.8,
                strokeWeight: 2,
                fillColor: color,
                fillOpacity: 0.35,
                map: map
            });
        }

        // Draw polyline
        function drawPolyline(coords, color) {
            const path = coords.map(coord => ({
                lat: coord[1],
                lng: coord[0]
            }));

            new google.maps.Polyline({
                path: path,
                geodesic: true,
                strokeColor: color,
                strokeOpacity: 0.8,
                strokeWeight: 2,
                map: map
            });
        }

        // Draw marker
        function drawMarker(coord, color) {
            new google.maps.Marker({
                position: { lat: coord[1], lng: coord[0] },
                map: map
            });
        }

        // Update sidebar statistics
        function updateStats(geojsonData) {
            const featureCount = geojsonData.features.length;
            let bounds = null;

            geojsonData.features.forEach(feature => {
                const coords = getCoordinatesFromFeature(feature);
                coords.forEach(coord => {
                    if (!bounds) {
                        bounds = {
                            minLat: coord[1],
                            maxLat: coord[1],
                            minLng: coord[0],
                            maxLng: coord[0]
                        };
                    } else {
                        bounds.minLat = Math.min(bounds.minLat, coord[1]);
                        bounds.maxLat = Math.max(bounds.maxLat, coord[1]);
                        bounds.minLng = Math.min(bounds.minLng, coord[0]);
                        bounds.maxLng = Math.max(bounds.maxLng, coord[0]);
                    }
                });
            });

            const statsHtml = `
                <div class="stat-item">
                    <span class="stat-label">Features:</span>
                    <span class="stat-value">${featureCount}</span>
                </div>
                ${bounds ? `
                <div class="stat-item">
                    <span class="stat-label">Latitude:</span>
                    <span class="stat-value">${bounds.minLat.toFixed(4)}°</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Longitude:</span>
                    <span class="stat-value">${bounds.minLng.toFixed(4)}°</span>
                </div>
                ` : ''}
            `;

            document.getElementById('stats').innerHTML = statsHtml;
            document.getElementById('featureCount').textContent = featureCount;
        }

        // Extract all coordinates from a feature
        function getCoordinatesFromFeature(feature) {
            const coords = [];
            const geometry = feature.geometry;

            function extractCoords(coord) {
                if (typeof coord[0] === 'number') {
                    coords.push(coord);
                } else {
                    coord.forEach(extractCoords);
                }
            }

            if (geometry.coordinates && geometry.coordinates.length > 0) {
                extractCoords(geometry.coordinates);
            }

            return coords;
        }

        // Initialize when page loads
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
